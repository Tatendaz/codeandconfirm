name: zizmor

# Static security scan of the workflows themselves (unpinned actions, template
# injection, over-broad tokens). Fails on high-severity findings.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install zizmor (pinned by hash)
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r .github/zizmor-requirements.txt

      - name: Scan workflows
        run: zizmor --min-severity high .github/workflows
